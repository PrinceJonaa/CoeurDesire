# Temporary, branch-scoped lockfile refresh for Supabase dependency.
name: Refresh M1 M2 dependency lock
on:
  push:
    branches: [feat/client-admin-m1-m2]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'PrinceJonaa/CoeurDesire' && github.actor == 'PrinceJonaa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock Supabase client dependencies"
            git push origin HEAD:feat/client-admin-m1-m2
          fi
